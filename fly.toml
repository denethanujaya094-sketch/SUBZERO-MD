app = 'subzero-md'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  BOT_NAME = 'DENETH-MD'
  COMMAND_MODE = 'privet'
  DB_URL = ''
  MONGO_URL = ''
  MYSQL_URL = ''
  OWNER_NUMBER = '94756086474'
  PORT = '5000'
  POSTGRES_URL = ''
  SESSION_ID = ''
  TIMEZONE = 'Africa/Harare'

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
